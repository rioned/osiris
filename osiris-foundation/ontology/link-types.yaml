# ═══════════════════════════════════════════════════════════════
#  OSIRIS Ontology — Link Types & Actions
# ═══════════════════════════════════════════════════════════════

link_types:

  owns:
    display_name: "Owns"
    directed: true
    source_types: [person, organization]
    target_types: [vehicle, vessel, aircraft, network_node]

  registered_to:
    display_name: "Registered To"
    directed: true
    source_types: [phone_number, email_address, vehicle, identity_document, network_node]
    target_types: [person, organization]

  communicated_with:
    display_name: "Communicated With"
    directed: false
    source_types: [person, phone_number, email_address, social_profile]
    target_types: [person, phone_number, email_address, social_profile]

  located_at:
    display_name: "Located At"
    directed: true
    source_types: [person, vehicle, vessel, aircraft, event, network_node]
    target_types: [place]

  sighted_at:
    display_name: "Sighted At"
    directed: true
    source_types: [person, vehicle, vessel]
    target_types: [place, event]

  member_of:
    display_name: "Member Of"
    directed: true
    source_types: [person]
    target_types: [organization, social_group]

  mentioned_in:
    display_name: "Mentioned In"
    directed: true
    source_types: [person, organization, place, vehicle, vessel, aircraft, network_node]
    target_types: [media, event, social_post]

  same_as:
    display_name: "Same As (resolved duplicate)"
    directed: false
    source_types: ["*"]
    target_types: ["*"]

  # ── Social Interaction Graph: typed, directional relationships ──
  # These turn scattered social feed data into a queryable network
  # that the graph-analytics layer operates on.

  follows:
    display_name: "Follows"
    directed: true
    description: "User A follows user B on a social platform"
    source_types: [person, social_profile]
    target_types: [person, social_profile]

  friend_of:
    display_name: "Friend Of"
    directed: false
    description: "Bidirectional friendship connection between two users"
    source_types: [person, social_profile]
    target_types: [person, social_profile]

  liked:
    display_name: "Liked"
    directed: true
    description: "User liked a post, comment, or media item"
    source_types: [person, social_profile]
    target_types: [social_post, social_comment, media]

  commented_on:
    display_name: "Commented On"
    directed: true
    description: "User posted a comment on a piece of content"
    source_types: [person, social_profile]
    target_types: [social_post, media]

  replied_to:
    display_name: "Replied To"
    directed: true
    description: "A comment is a reply to another comment or post"
    source_types: [social_comment]
    target_types: [social_comment, social_post]

  shared:
    display_name: "Shared"
    directed: true
    description: "User reshared/reposted content to their network"
    source_types: [person, social_profile]
    target_types: [social_post, media]

  mentioned:
    display_name: "Mentioned"
    directed: true
    description: "User was @-mentioned in a post or comment"
    source_types: [social_post, social_comment]
    target_types: [person, social_profile]

  tagged:
    display_name: "Tagged"
    directed: true
    description: "User was tagged (photo, post, check-in)"
    source_types: [social_post, media]
    target_types: [person, social_profile]

  works_at:
    display_name: "Works At"
    directed: true
    description: "Person is employed by or affiliated with an organization"
    source_types: [person]
    target_types: [organization]


# ── Governed write-back actions (every one is audited) ──────────
actions:

  create_entity:
    display_name: "Create Entity"
    effect: create
    requires_role: analyst
    audited: true

  link_entities:
    display_name: "Link Entities"
    effect: link
    requires_role: analyst
    audited: true

  merge_entities:
    display_name: "Merge Duplicates"
    effect: merge
    requires_role: analyst
    audited: true
    # writes a `same_as` link, repoints relationships, keeps both source rows

  flag_threat:
    display_name: "Flag as Threat"
    effect: flag
    requires_role: analyst
    audited: true

  add_to_case:
    display_name: "Add to Investigation"
    effect: update
    requires_role: viewer
    audited: true

  export_case:
    display_name: "Export Investigation"
    effect: export
    requires_role: admin     # exports leave the system — highest bar
    audited: true
